<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SIPASAR NIAS</title>
    <link href="assets/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #002b49;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <div class="card login-card p-4 shadow-lg border-0">
        <div class="text-center mb-4">
            <i class="fa-solid fa-fish-fins fs-1 text-primary"></i>
            <h4 class="fw-bold mt-2">SIPASAR NIAS</h4>
            <p class="text-muted small">Silakan login ke portal kelautan & perikanan</p>
        </div>

        <form onsubmit="prosesLogin(event)">
            <div class="mb-3">
                <label class="form-label fw-bold">Login Sebagai</label>
                <select id="role" class="form-select">
                    <option value="User">Pembeli / Masyarakat</option>
                    <option value="Admin">Administrator / Dinas</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Username</label>
                <input type="text" id="username" class="form-control" placeholder="Masukkan username" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Masukkan password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mt-2">Masuk Sistem</button>
        </form>

        <div class="text-center mt-3">
            <a href="index.html" class="text-decoration-none small text-muted"><i class="fa-solid fa-arrow-left me-1"></i>Kembali ke Beranda</a>
        </div>
    </div>

    <script>
        function prosesLogin(event) {
            event.preventDefault();
            let role = document.getElementById("role").value;
            let user = document.getElementById("username").value;

            alert("Login Berhasil! Selamat datang " + user + " (" + role + ")");
            window.location.href = "index.html";
        }
    </script>

    <!-- Bootstrap 5.3.3 JS Bundle CDN -->
    <script src="assets/bootstrap/js/bootstrap.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
